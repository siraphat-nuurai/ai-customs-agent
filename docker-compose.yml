version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: customs_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    networks:
      - customs_network

  frontend:
    build:
      context: ./frontend
    container_name: customs_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    env_file:
      - .env
    networks:
      - customs_network

networks:
  customs_network:
    driver: bridge